<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tutomAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #06070f;
      --surface: #0d0e1a;
      --border: rgba(255,255,255,0.07);
      --text: rgba(255,255,255,0.88);
      --muted: rgba(255,255,255,0.38);
      --accent: #e8637a;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Space Grotesk', sans-serif;
    }

    html { background: var(--bg); }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }

    .wrap {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .wordmark {
      font-family: var(--font-display);
      font-size: 48px;
      letter-spacing: -1.5px;
      color: var(--text);
      font-style: italic;
      margin-bottom: 16px;
    }

    .wordmark span { color: var(--accent); }

    .tagline {
      font-size: 16px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 52px;
      font-weight: 400;
    }

    .store-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 28px;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      letter-spacing: 0.1px;
      transition: border-color 0.15s;
      margin-bottom: 52px;
    }

    .store-btn:hover { border-color: rgba(255,255,255,0.18); }

    .store-icon {
      width: 18px;
      height: 18px;
      opacity: 0.6;
    }

    .disclaimer {
      font-size: 11px;
      color: rgba(255,255,255,0.22);
      line-height: 1.7;
      margin-bottom: 28px;
      max-width: 320px;
      margin-left: auto;
      margin-right: auto;
    }

    .footer-links {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    .footer-links a {
      font-size: 12px;
      color: rgba(255,255,255,0.28);
      text-decoration: none;
      letter-spacing: 0.2px;
    }

    .footer-links a:hover { color: rgba(255,255,255,0.55); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="wordmark">tutom<span>AI</span></div>
    <p class="tagline">Juegos de fiesta con inteligencia artificial.<br>Hecho para Chile y Latinoamérica.</p>

    <a href="https://play.google.com/store/apps/details?id=com.tutomai.app" class="store-btn">
      <svg class="store-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M3.18 23.76a2 2 0 0 0 2.09-.15l11.34-6.55-2.93-2.93-10.5 9.63zM.5 1.27C.19 1.67 0 2.23 0 2.96v18.08c0 .73.19 1.29.5 1.69l.09.09L10.44 12.5v-.23L.59 1.18l-.09.09zm19.27 8.4-2.89-1.67-3.27 3.27 3.27 3.27 2.9-1.68c.83-.48.83-1.26 0-1.74l-.01-.45zM3.18.24 14.52 6.79l-2.93 2.93L1.27.09A2 2 0 0 1 3.18.24z"/>
      </svg>
      Disponible en Google Play
    </a>

    <p class="disclaimer">tutomAI es un juego social para adultos mayores de 18 años. No promovemos el consumo excesivo de alcohol.</p>

    <div class="footer-links">
      <a href="/terms.html">Términos</a>
      <a href="/privacy.html">Privacidad</a>
      <a href="/support.html">Soporte</a>
    </div>
  </div>
</body>
</html>
